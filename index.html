<meta charset="utf-8">
<title>Pora</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#13402F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Figtree:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Layout: one phone column (max 520px), tab bar docked at the bottom with a raised GO; the live run is a full-screen night panel.
   Brand: Pora kit — pelouse / pelouse claire / orange (the "toi" dot, GO and progress only) / craie / encre / menthe. */
:root{
  --pelouse:#13402F; --pelouse-claire:#1F6B4E; --orange:#FF6A45; --craie:#F3F5F1; --encre:#0E1A14; --menthe:#CFE8DC;
  --bg:#F3F5F1; --surface:#FFFFFF; --surface-2:#E5ECE6; --ink:#0E1A14; --ink-2:#4E6157; --line:#D6DFD8;
  --accent:#13402F; --accent-2:#1F6B4E; --accent-soft:#CFE8DC; --on-accent:#FFFFFF; --logo:#13402F;
  --go:#FF6A45; --on-go:#FFFFFF;
  --z-ef:#1F6B4E; --z-sl:#2D6A86; --z-tempo:#B7801A; --z-frac:#A8385A; --z-test:#5A4DA6; --z-recup:#7A8B82;
  --good:#1F6B4E; --warn:#B7801A; --bad:#C2413B;
  --night:#0A140F; --night-2:#14231B; --night-3:#213529; --night-ink:#F3F5F1; --night-ink-2:#95AA9E;
  --shadow:0 1px 2px rgba(14,26,20,.05),0 10px 28px rgba(14,26,20,.07);
  --scrim:rgba(10,20,15,.5);
  --f-display:"Outfit","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --r:20px; --r-sm:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1A14; --surface:#16241D; --surface-2:#1F3128; --ink:#EEF3EE; --ink-2:#9CB0A4; --line:#2A3D33;
  --accent:#CFE8DC; --accent-2:#8FCBAF; --accent-soft:#1E3A2E; --on-accent:#13402F; --logo:#FFFFFF;
  --go:#FF6A45; --on-go:#FFFFFF;
  --z-ef:#5FBF94; --z-sl:#72B4D3; --z-tempo:#E4B04F; --z-frac:#E27C9C; --z-test:#A99DEB; --z-recup:#93A69B;
  --good:#5FBF94; --warn:#E4B04F; --bad:#FF7B72;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px rgba(0,0,0,.25); --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1A14; --surface:#16241D; --surface-2:#1F3128; --ink:#EEF3EE; --ink-2:#9CB0A4; --line:#2A3D33;
  --accent:#CFE8DC; --accent-2:#8FCBAF; --accent-soft:#1E3A2E; --on-accent:#13402F; --logo:#FFFFFF;
  --go:#FF6A45; --on-go:#FFFFFF;
  --z-ef:#5FBF94; --z-sl:#72B4D3; --z-tempo:#E4B04F; --z-frac:#E27C9C; --z-test:#A99DEB; --z-recup:#93A69B;
  --good:#5FBF94; --warn:#E4B04F; --bad:#FF7B72;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px rgba(0,0,0,.25); --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.ic{width:22px;height:22px;flex:none}
.ic-sm{width:16px;height:16px}

#app{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(104px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
#app.ob{padding-block:20px 32px;min-height:100%}

/* type */
.display{font-family:var(--f-display);font-weight:850;letter-spacing:-.02em;line-height:1.02;text-wrap:balance;margin:0}
.h1{font-family:var(--f-display);font-weight:800;font-size:28px;letter-spacing:-.015em;line-height:1.08;margin:0;text-wrap:balance}
.h2{font-family:var(--f-display);font-weight:750;font-size:21px;letter-spacing:-.01em;line-height:1.15;margin:0;text-wrap:balance}
.h3{font-family:var(--f-display);font-weight:700;font-size:16px;margin:0}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin:0}
.muted{color:var(--ink-2)}
.num{font-variant-numeric:tabular-nums}
p{margin:0}
.wordmark{font-family:var(--f-display);font-weight:900;font-style:italic;letter-spacing:-.04em;line-height:.9}

/* generic */
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:999px;font-weight:700;font-size:15px;white-space:nowrap;transition:transform .12s ease,background .2s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-go{background:var(--go);color:var(--on-go);font-family:var(--f-display);font-weight:900;letter-spacing:.02em;font-size:17px}
.btn-ghost{background:var(--surface-2);color:var(--ink)}
.btn-line{border:1.5px solid var(--line);color:var(--ink)}
.btn-danger{background:var(--bad);color:#fff}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.link{color:var(--accent);font-weight:600;font-size:14px}
.chip{--c:var(--ink-2);display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px 4px 8px;border-radius:999px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.chip.plain::before{display:none}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.pill.good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-family:var(--f-display);font-weight:800;font-size:16px;display:grid;place-items:center;flex:none}
.avatar.lg{width:72px;height:72px;font-size:26px}
.demo-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;border-radius:14px;background:var(--accent-soft);color:var(--accent);font-size:13.5px;font-weight:600}

/* phase bar */
.phase{display:flex;flex-direction:column;gap:8px}
.phase-bar{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:3px}
.phase-bar i{height:8px;border-radius:3px;background:var(--surface-2);position:relative}
.phase-bar i.f{background:var(--c)}
.phase-bar i.d{opacity:.55}
.phase-bar i.cur{outline:2px solid var(--ink);outline-offset:1.5px}

/* week strip */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 9px;border-radius:14px;background:var(--surface);font-size:12px;color:var(--ink-2);min-width:0}
.day b{font-family:var(--f-num);font-weight:700;font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}
.day .dot{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--c,transparent)}
.day .dot.done{background:var(--c);color:var(--surface)}
.day .dot.done .ic{width:13px;height:13px;stroke-width:3}
.day .dot.none{border-color:transparent}
.day .dot.none::after{content:"";width:4px;height:4px;border-radius:50%;background:var(--line)}
.day.today{background:var(--ink);color:var(--bg)}
.day.today b{color:var(--bg)}

/* hero session card */
.hero{background:var(--surface);border-radius:26px;padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.hero .when{font-size:13px;font-weight:600;color:var(--ink-2)}
.target{display:flex;flex-direction:column;gap:2px}
.target .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.target .pace{font-family:var(--f-num);font-weight:700;font-size:64px;line-height:.95;letter-spacing:-.01em;font-variant-numeric:tabular-nums;color:var(--tc,var(--ink))}
.target .pace small{font-family:var(--f-body);font-size:15px;font-weight:600;color:var(--ink-2);letter-spacing:0;margin-left:4px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0;border-top:1px solid var(--line)}
.steps li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line)}
.steps .sw{width:10px;height:10px;border-radius:3px;background:var(--c,var(--line));transform:translateY(1px)}
.steps .sl{font-weight:600}
.steps .sd{grid-column:2/4;color:var(--ink-2);font-size:13.5px}
.steps .sp{font-variant-numeric:tabular-nums;font-weight:600;font-size:13.5px;color:var(--ink-2);white-space:nowrap}
.est{font-size:13.5px;color:var(--ink-2);font-weight:500}
.actions{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px}
.actions .btn{padding:0 10px}
.note{font-size:13.5px;padding:10px 12px;border-radius:12px;background:var(--surface-2);color:var(--ink)}
.done-box{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:16px;background:color-mix(in srgb,var(--good) 10%,var(--surface))}
.statline{display:flex;flex-wrap:wrap;gap:6px 16px;font-variant-numeric:tabular-nums}
.statline span{display:flex;flex-direction:column;font-size:12px;color:var(--ink-2);font-weight:600}
.statline b{font-family:var(--f-num);font-weight:700;font-size:26px;color:var(--ink)}

/* check-in */
.scale{display:grid;grid-template-columns:72px 1fr;align-items:center;gap:10px}
.scale span{font-size:13.5px;font-weight:600}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.seg button,.seg label{height:36px;border-radius:10px;background:var(--surface-2);font-weight:700;font-size:14px;display:grid;place-items:center;font-variant-numeric:tabular-nums;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--bg)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--ink);color:var(--bg)}
.seg label:has(input:focus-visible){outline:2.5px solid var(--accent)}
.seg.ten{grid-template-columns:repeat(10,1fr)}

/* coach */
.coach-list{display:flex;flex-direction:column;gap:10px}
.coach{--k:var(--accent);display:grid;grid-template-columns:36px 1fr;gap:12px;padding:14px;border-radius:18px;background:var(--surface)}
.coach .mk{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--k) 15%,transparent);color:var(--k);font-family:var(--f-display);font-weight:900;font-size:15px}
.coach .kl{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--k)}
.coach h3{font-size:15.5px;font-weight:700;margin:2px 0 3px;line-height:1.3}
.coach p{font-size:14px;color:var(--ink-2)}
.coach .btn{margin-top:10px;min-height:40px;font-size:14px}
.k-objection{--k:var(--warn)} .k-alert{--k:var(--bad)} .k-bravo{--k:var(--good)} .k-test{--k:var(--z-test)} .k-info{--k:var(--accent)}

/* plan */
.seg-toggle{display:inline-grid;grid-auto-flow:column;background:var(--surface-2);border-radius:999px;padding:3px}
.seg-toggle button{padding:7px 14px;border-radius:999px;font-weight:700;font-size:13.5px;color:var(--ink-2)}
.seg-toggle button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.week{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.week.cur{box-shadow:0 0 0 2px var(--ink)}
.week-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.week-head .h3 span{color:var(--ink-2);font-weight:600}
.srow{display:grid;grid-template-columns:44px 4px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);text-align:left;width:100%}
.srow .d{font-size:12px;color:var(--ink-2);font-weight:600;line-height:1.2}
.srow .d b{display:block;font-size:20px;font-weight:700;color:var(--ink);font-family:var(--f-num);font-variant-numeric:tabular-nums}
.srow .bar{width:4px;height:34px;border-radius:2px;background:var(--c)}
.srow .t{font-weight:600;line-height:1.25;min-width:0}
.srow .t small{display:block;color:var(--ink-2);font-weight:500;font-size:12.5px;font-variant-numeric:tabular-nums}
.srow .r{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;text-align:right;white-space:nowrap}
.srow .r.done{color:var(--good)} .srow .r.miss{color:var(--bad)} .srow .r.skip{color:var(--ink-2);font-weight:600}
.tbl-wrap{overflow-x:auto;margin-inline:-4px;padding:0 4px 6px;-webkit-overflow-scrolling:touch}
table.ptab{border-collapse:separate;border-spacing:0;min-width:620px;width:100%;background:var(--surface);border-radius:var(--r);overflow:hidden;font-size:13px}
.ptab th,.ptab td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.ptab th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);background:var(--surface-2)}
.ptab td.w{font-family:var(--f-display);font-weight:800;font-size:15px;white-space:nowrap;position:sticky;left:0;background:var(--surface)}
.ptab td.w small{display:block;font-family:var(--f-body);font-weight:600;font-size:11px;color:var(--ink-2)}
.ptab tr.cur td{background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
.ptab .cell{display:flex;flex-direction:column;gap:6px}
.ptab .cell b{font-weight:650;line-height:1.25}
.ptab .cell small{color:var(--ink-2);font-variant-numeric:tabular-nums}
.pace-in{width:84px;height:34px;border-radius:9px;border:1.5px solid var(--line);background:var(--bg);padding:0 8px;font-weight:700;font-variant-numeric:tabular-nums}
.pace-in.has{border-color:var(--good);color:var(--good)}

/* progress */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
.kpi{background:var(--surface);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi b{font-family:var(--f-num);font-weight:700;font-size:clamp(18px,5.4vw,28px);white-space:nowrap;font-variant-numeric:tabular-nums;line-height:1.05}
.kpi span{font-size:12px;color:var(--ink-2);font-weight:600}
.big5k{font-family:var(--f-num);font-weight:700;font-size:84px;line-height:.9;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--ink-2);font-size:10.5px;font-family:var(--f-body);font-variant-numeric:tabular-nums}
.chart .grid{stroke:var(--line);stroke-width:1}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:14px 8px;border-radius:16px;background:var(--surface);min-width:0}
.badge .medal{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-num);font-weight:900;font-size:17px;background:var(--surface-2);color:var(--ink-2);border:2px dashed var(--line)}
.badge.on .medal{background:var(--ink);color:var(--bg);border:2px solid var(--ink)}
.badge b{font-size:13px}
.badge small{font-size:11.5px;color:var(--ink-2);line-height:1.3}
.badge:not(.on) b{color:var(--ink-2)}
.hist{display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r);padding:4px 16px}
.hrow{display:grid;grid-template-columns:4px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.hrow:last-child{border-bottom:0}
.hrow .bar{width:4px;height:32px;border-radius:2px;background:var(--c)}
.hrow small{display:block;color:var(--ink-2);font-size:12.5px}
.hrow .r{font-variant-numeric:tabular-nums;font-weight:700;text-align:right}
.hrow .r small{font-weight:500}
.empty{padding:22px;text-align:center;color:var(--ink-2);background:var(--surface);border-radius:var(--r);font-size:14px}

/* profile */
.zones{display:flex;flex-direction:column}
.zrow{display:grid;grid-template-columns:10px 1fr auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.zrow:last-child{border-bottom:0}
.zrow i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.zrow b{font-variant-numeric:tabular-nums}
.zrow small{display:block;color:var(--ink-2);font-size:12.5px}
.menu{display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r);padding:4px 16px}
.menu button{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);font-weight:600;text-align:left}
.menu button:last-child{border-bottom:0}
.menu button.danger{color:var(--bad)}

/* forms */
.field{display:flex;flex-direction:column;gap:6px}
.field label,.flabel{font-size:13px;font-weight:700;color:var(--ink-2)}
.input{height:50px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);padding:0 14px;font-size:16px;width:100%;min-width:0}
.input:focus{border-color:var(--accent);outline:none}
textarea.input{height:80px;padding:12px 14px;resize:vertical}
.input-wrap{position:relative}
.input-wrap .pre{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-2);font-weight:700}
.input-wrap .input{padding-left:30px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--bad);font-size:13px;font-weight:600}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:16px;background:var(--surface);border:2px solid transparent;text-align:left;width:100%}
.opt.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
.opt b{display:block;font-size:15.5px}
.opt small{color:var(--ink-2);font-size:13px}
.opt .mk{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);font-family:var(--f-display);font-weight:900;font-size:13px;flex:none}
.opt.on .mk{background:var(--accent);color:var(--on-accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipbtn{padding:10px 14px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line);font-weight:650;font-size:14px}
.chipbtn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.daypick{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.daypick button{height:46px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line);font-weight:700;font-size:13px}
.daypick button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--accent);height:28px}
.rangeval{font-family:var(--f-num);font-weight:700;font-size:48px;font-variant-numeric:tabular-nums;line-height:1}
.rangeval small{font-family:var(--f-body);font-size:15px;color:var(--ink-2);font-weight:600;margin-left:4px}
.switch{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px;cursor:pointer}
.switch input{width:20px;height:20px;accent-color:var(--accent)}

/* onboarding */
.ob-top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px}
.ob-dots{display:flex;gap:6px}
.ob-dots i{width:22px;height:5px;border-radius:3px;background:var(--line)}
.ob-dots i.on{background:var(--ink)}
.ob-body{display:flex;flex-direction:column;gap:18px;flex:1}
.ob-foot{display:flex;flex-direction:column;gap:10px;margin-top:auto;padding-top:8px}
.back{width:40px;height:40px;border-radius:50%;background:var(--surface);display:grid;place-items:center}
.back .ic{transform:rotate(180deg)}
.welcome-mark{font-size:clamp(72px,26vw,128px);color:var(--ink)}
.welcome-mark span{color:var(--go)}
.preview{background:var(--surface);border-radius:24px;padding:16px 16px 12px;display:flex;flex-direction:column;gap:10px}
.preview .bars{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;align-items:end;height:96px}
.preview .bars i{border-radius:5px 5px 2px 2px;background:var(--c)}
.preview .bars i.d{opacity:.45}
.preview .axis{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;font-size:10px;color:var(--ink-2);text-align:center;font-variant-numeric:tabular-nums}
.vals{display:grid;gap:10px}
.val{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start}
.val .mk{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--ink);color:var(--bg)}
.val .mk .ic{width:18px;height:18px}
.val b{display:block;font-size:15px}
.val small{color:var(--ink-2);font-size:13.5px}
.contract{background:var(--ink);color:var(--bg);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:14px}
.contract ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px;counter-reset:c}
.contract li{display:grid;grid-template-columns:28px 1fr;gap:10px;counter-increment:c;font-size:14.5px;line-height:1.4}
.contract li::before{content:counter(c);font-family:var(--f-display);font-weight:900;font-size:20px;color:var(--go);line-height:1.1}
.contract .eyebrow{color:color-mix(in srgb,var(--bg) 65%,transparent)}
.hold{position:relative;overflow:hidden;isolation:isolate;user-select:none;-webkit-user-select:none;touch-action:none}
.hold::after{content:"";position:absolute;inset:0;background:rgba(255,255,255,.28);transform-origin:left;transform:scaleX(0);z-index:-1}
.hold.holding::after{transform:scaleX(1);transition:transform var(--hold,1.1s) linear}
.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.summary-grid div{background:var(--surface);border-radius:14px;padding:10px 12px;min-width:0}
.summary-grid b{display:block;font-family:var(--f-num);font-weight:700;font-size:28px;font-variant-numeric:tabular-nums}
.summary-grid span{font-size:11.5px;color:var(--ink-2);font-weight:600}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 84px 1fr 1fr;align-items:center;height:68px}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:650;color:var(--ink-2);padding:6px 0}
.tab.on{color:var(--ink)}
.tab.on .ic{stroke-width:2.4}
.go-tab{justify-self:center;width:66px;height:66px;border-radius:50%;background:var(--go);color:var(--on-go);font-family:var(--f-display);font-weight:900;font-size:19px;letter-spacing:.02em;transform:translateY(-14px);box-shadow:0 8px 22px color-mix(in srgb,var(--go) 45%,transparent),0 0 0 5px var(--bg)}
.go-tab:active{transform:translateY(-14px) scale(.95)}

/* sheet */
#sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
#sheet .scrim{position:absolute;inset:0;background:var(--scrim);animation:fade .2s ease}
.sheet-panel{position:relative;width:100%;max-width:560px;max-height:92%;overflow-y:auto;overscroll-behavior:contain;background:var(--bg);border-radius:26px 26px 0 0;padding:10px max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:rise .26s cubic-bezier(.2,.8,.2,1)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet-x{position:absolute;right:max(14px,env(safe-area-inset-right,0px));top:12px;width:36px;height:36px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center}
#sheetBody{display:flex;flex-direction:column;gap:16px}
.bubble{display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:20px 20px 20px 6px;background:var(--surface)}
.bubble.me{border-radius:20px 20px 6px 20px;background:var(--accent);color:var(--on-accent);align-self:flex-end;max-width:80%;padding:10px 14px;font-weight:600}
.verdict{font-family:var(--f-display);font-weight:900;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.verdict.no{color:var(--bad)} .verdict.yes{color:var(--good)} .verdict.cond{color:var(--warn)}
.reasons{display:grid;gap:8px}
.reasons button{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-radius:16px;background:var(--surface);font-weight:650;text-align:left}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;z-index:70;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-weight:650;font-size:14px;max-width:min(90vw,420px);text-align:center;transition:opacity .2s,transform .2s;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* live run: deliberate night panel in both themes */
#live{position:fixed;inset:0;z-index:60;background:var(--night);color:var(--night-ink);display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));overflow-y:auto}
.lv{max-width:520px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:16px;flex:1}
.lv-top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px}
.lv-x{width:40px;height:40px;border-radius:50%;background:var(--night-2);display:grid;place-items:center;color:var(--night-ink)}
.lv-brand{font-size:24px;color:var(--night-ink)}
.lv-brand span{color:var(--go)}
.lv-eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--night-ink-2)}
.lv-pick{display:grid;gap:8px}
.lv-pick button{display:grid;grid-template-columns:4px 1fr auto;gap:12px;align-items:center;padding:14px;border-radius:16px;background:var(--night-2);text-align:left;border:2px solid transparent;color:var(--night-ink)}
.lv-pick button.on{border-color:var(--go)}
.lv-pick .bar{width:4px;height:30px;border-radius:2px;background:var(--c)}
.lv-pick small{display:block;color:var(--night-ink-2);font-size:12.5px}
.lv-center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:10px 0}
.lv-go{width:min(58vw,220px);height:min(58vw,220px);border-radius:50%;background:var(--go);color:var(--on-go);font-family:var(--f-display);font-weight:900;font-size:clamp(48px,15vw,68px);box-shadow:0 0 0 12px color-mix(in srgb,var(--go) 18%,transparent),0 0 0 26px color-mix(in srgb,var(--go) 8%,transparent)}
.lv-go:active{transform:scale(.96)}
.lv-hint{color:var(--night-ink-2);font-size:13.5px;max-width:32ch}
.lv-link{color:var(--night-ink);font-weight:650;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.lv-count{font-family:var(--f-num);font-weight:900;font-size:min(56vw,260px);line-height:.85;color:var(--go)}
.lv-clock{font-family:var(--f-num);font-weight:700;font-size:clamp(92px,30vw,150px);line-height:.88;font-variant-numeric:tabular-nums;letter-spacing:-.01em;text-align:center}
.lv-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lv-stats div{background:var(--night-2);border-radius:16px;padding:12px;text-align:center;min-width:0}
.lv-stats b{display:block;font-family:var(--f-num);font-weight:700;font-size:36px;line-height:1.05;font-variant-numeric:tabular-nums}
.lv-stats span{font-size:11.5px;color:var(--night-ink-2);font-weight:650}
.gauge{display:flex;flex-direction:column;gap:6px}
.gauge-track{position:relative;height:12px;border-radius:6px;background:var(--night-3)}
.gauge-zone{position:absolute;top:0;bottom:0;border-radius:6px;background:color-mix(in srgb,var(--zc,var(--z-ef)) 60%,transparent)}
.gauge-cur{position:absolute;top:-5px;width:6px;height:22px;border-radius:3px;background:var(--night-ink);transform:translateX(-50%);transition:left .4s ease}
.gauge-lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--night-ink-2);font-weight:600}
.lv-status{font-family:var(--f-display);font-weight:850;font-size:17px;text-align:center;min-height:24px}
.lv-status.ok{color:var(--z-ef)} .lv-status.fast{color:var(--go)} .lv-status.slow{color:var(--z-tempo)}
.lv-map{background:var(--night-2);border-radius:18px;overflow:hidden;aspect-ratio:16/9;max-width:100%}
.lv-map > svg{width:100%;height:100%;display:block}
.lv-ctrl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lv-btn{min-height:60px;border-radius:999px;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px}
.lv-btn.pause{background:var(--night-ink);color:var(--night)}
.lv-btn.stop{background:var(--night-3);color:var(--night-ink)}
.lv-btn.stop.hold::after{background:var(--go);opacity:.9}
.lv-flag{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--night-2);font-size:12px;font-weight:700;color:var(--night-ink-2)}
.lv-flag.warn{color:var(--z-tempo)}
.lv-flag.sim{color:var(--go)}
.lv-target{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13.5px;color:var(--night-ink-2);font-weight:600;flex-wrap:wrap}
.lv-target b{color:var(--night-ink);font-variant-numeric:tabular-nums}
.lv-fallback{background:var(--night-2);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px;text-align:left}
.lv-fallback p{color:var(--night-ink-2);font-size:14px}
.lv-fallback .btn-ghost{background:var(--night-3);color:var(--night-ink)}
.paused .lv-clock{opacity:.5}

.route-bg{fill:var(--surface-2)}
.route-grid{fill:var(--line);stroke:none}
.route-line{stroke:var(--go);fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.route-start{fill:var(--z-ef);stroke:var(--surface);stroke-width:2.5}
.route-end{fill:var(--ink);stroke:var(--surface);stroke-width:2.5}
#live .route-bg{fill:var(--night-2)} #live .route-grid{fill:var(--night-3)} #live .route-end{fill:var(--night-ink);stroke:var(--night-2)} #live .route-start{stroke:var(--night-2)}
.splits{display:flex;flex-direction:column;gap:6px}
.split{display:grid;grid-template-columns:40px 1fr 52px;gap:10px;align-items:center;font-size:13px;font-variant-numeric:tabular-nums;font-weight:600}
.split i{height:8px;border-radius:4px;background:var(--accent)}
.split.best i{background:var(--go)}


/* brand logo */
.logo{color:var(--logo);display:block}
.logo svg{display:block;height:100%;width:auto}
.logo .dot{fill:var(--orange)}
.applogo{height:26px}
.welcome-logo{height:auto;width:min(62vw,250px);margin:8px auto 0}
.welcome-logo svg{width:100%;height:auto}

/* splash */
#splash{position:fixed;inset:0;z-index:100;background:var(--pelouse);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;cursor:pointer;transition:opacity .45s ease,transform .55s cubic-bezier(.6,0,.3,1);touch-action:manipulation;user-select:none;-webkit-user-select:none}
#splash.out{opacity:0;transform:scale(1.06);pointer-events:none}
#splash .sp-track{width:min(58vw,240px);height:auto;overflow:visible}
#splash .sp-word{width:min(46vw,190px);opacity:0;transform:translateY(14px);transition:opacity .5s ease,transform .6s cubic-bezier(.2,.8,.2,1)}
#splash .sp-word svg{width:100%;height:auto;display:block}
#splash .sp-tag{font-family:var(--f-display);font-weight:600;font-size:16px;color:var(--menthe);opacity:0;transition:opacity .6s ease .15s;text-align:center}
#splash.reveal .sp-word{opacity:1;transform:none}
#splash.reveal .sp-tag{opacity:1}
#splash .sp-hint{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom,0px));font-size:12.5px;color:rgba(207,232,220,.7);font-weight:600;letter-spacing:.04em}
#splash .sp-hi{font-family:var(--f-display);font-weight:700;font-size:18px;color:#fff;opacity:0;transition:opacity .4s}
#splash.reveal .sp-hi{opacity:1}
.ripple{position:absolute;border-radius:50%;border:2px solid var(--menthe);pointer-events:none;animation:ripple .7s ease-out forwards}
@keyframes ripple{from{width:0;height:0;opacity:.8;transform:translate(-50%,-50%)}to{width:180px;height:180px;opacity:0;transform:translate(-50%,-50%)}}

/* coach avatar & voice */
.cav{display:block;flex:none}
.cbubble{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:start}
.cbubble > :first-child{background:var(--accent-soft);border-radius:22px;display:grid;place-items:center;padding:2px 0;align-self:start}
.cbubble .say{position:relative;background:var(--surface);border-radius:4px 20px 20px 20px;padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.cbubble .who{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-2)}
.cbubble .say p{font-size:14.5px}
.cbubble .say .row{flex-wrap:wrap;gap:8px}
.cbubble .say .btn{min-height:38px;font-size:13.5px;padding:0 14px}
.coach .mk.av{background:none;width:40px;height:40px}
.coach{grid-template-columns:40px 1fr}
.builder{display:flex;flex-direction:column;gap:16px}
.builder-stage{display:grid;place-items:center;padding:18px;border-radius:24px;background:var(--accent-soft);position:relative}
.builder-stage .nm{font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--accent);margin-top:6px}
.builder-stage .moods{display:flex;gap:6px;position:absolute;right:10px;bottom:10px}
.builder-stage .moods button{width:30px;height:30px;border-radius:50%;background:var(--surface);font-size:12px;font-weight:800;color:var(--ink-2)}
.builder-stage .moods button.on{background:var(--accent);color:var(--on-accent)}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.swatch{width:40px;height:40px;border-radius:50%;background:var(--c);border:3px solid var(--surface);box-shadow:0 0 0 1.5px var(--line)}
.swatch.on{box-shadow:0 0 0 3px var(--accent)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.thumb{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:14px;background:var(--surface);border:2px solid transparent;font-size:11.5px;font-weight:650;color:var(--ink-2)}
.thumb.on{border-color:var(--accent);color:var(--ink)}
.tone{display:grid;gap:8px}

/* body map */
.bodymap{display:grid;grid-template-columns:1fr;justify-items:center;gap:10px}
.bodymap svg{width:min(70vw,260px);height:auto}
.bm-sil{fill:var(--surface-2);stroke:var(--line);stroke-width:1.5}
.bm-z{fill:var(--accent-2);fill-opacity:.14;stroke:var(--accent-2);stroke-opacity:.45;stroke-width:1.2;cursor:pointer;transition:fill-opacity .15s}
.bm-z:hover{fill-opacity:.28}
.bm-z.on{fill:var(--bad);fill-opacity:.85;stroke:var(--bad);stroke-opacity:1}
.bm-z.hist{fill:var(--warn);fill-opacity:.45}
.bm-z:focus-visible{outline:none;stroke:var(--ink);stroke-width:2.5}
.bm-lbl{font-size:10px;fill:var(--ink-2);font-weight:700;letter-spacing:.06em}
.painlog{display:flex;flex-direction:column}
.painlog .zrow i{background:var(--c)}

/* real map (hosted version with Leaflet) */
.mapbox{border-radius:16px;overflow:hidden;aspect-ratio:16/10;max-width:100%;background:var(--surface-2);position:relative}
.mapbox .leaflet-container{width:100%;height:100%;background:var(--surface-2);font-family:var(--f-body)}
.lv-map .leaflet-container{background:var(--night-2)}
.lv-map .leaflet-tile-pane,.mapbox.dark .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) saturate(.6) brightness(.9) contrast(.9)}
.leaflet-control-attribution{font-size:9.5px!important;background:rgba(255,255,255,.65)!important}
.me-dot{width:18px;height:18px;border-radius:50%;background:var(--orange);border:3px solid #fff;box-shadow:0 0 0 6px rgba(255,106,69,.25)}
.gps-chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:6px 12px;border-radius:999px;background:var(--night-2);color:var(--night-ink-2)}
.gps-chip i{width:8px;height:8px;border-radius:50%;background:var(--night-ink-2)}
.gps-chip.good i{background:#5FBF94} .gps-chip.weak i{background:#E4B04F} .gps-chip.bad i{background:#FF7B72}

/* UX pass */
details.more{border-top:1px solid var(--line);padding-top:10px}
details.more>summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--accent-2);list-style:none;display:flex;align-items:center;gap:8px;min-height:32px}
details>summary::-webkit-details-marker{display:none}
details.more>summary::after{content:"";width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translateY(-2px);transition:transform .2s}
details.more[open]>summary::after{transform:rotate(-135deg)}
details.more .steps{margin-top:8px}
details.week{display:block}
details.week>summary{list-style:none;cursor:pointer}
details.week[open]>summary{margin-bottom:6px}
.week-head .r-end{display:flex;align-items:center;gap:8px;flex:none}
.wk-chev{transition:transform .2s;color:var(--ink-2)}
details.week[open] .wk-chev{transform:rotate(90deg)}
.weekcard{gap:14px}
.weekcard .day{background:var(--surface-2)}
.weekcard .day.today{background:var(--ink)}
button.day{border:0;cursor:pointer;font:inherit;color:var(--ink-2)}
button.day:active{transform:scale(.96)}
#app.ob{padding-block:20px 0}
#app.ob .ob-foot{position:sticky;bottom:0;z-index:5;margin-top:auto;padding:22px 0 calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 72%,transparent)}
.lv-opts{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.lv-switch{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:650;color:var(--night-ink);cursor:pointer}
.lv-switch input{width:20px;height:20px;accent-color:var(--orange)}

   ========================================================= */

const relDay = s => { const n = diffDays(todayISO(), s); if (n === 0) return "Aujourd'hui"; if (n === 1) return 'Demain'; if (n === -1) return 'Hier'; if (n > 1 && n < 7) return cap(DAYS_L[wd(s)]); return cap(fmtDate(s)); };

  const out = []; const s = a.sessionId ? findSession(a.sessionId) : null; const type = s ? s.type : 'libre';
  const p = a.paceSec, zk = s ? zoneKey(s) : 'ef', range = zr(zk);
  const easy = s ? (EASY.includes(type) || ['light', 'mini'].includes(S.adapt[s.id])) : false;
  if (p && s && easy) {
    const [lo, hi] = range;
    if (p < lo - 5) out.push(['objection', `Trop rapide de ${fmtGap(lo - p)} au km`, `${fmtPace(p)}/km sur une sortie facile, alors que ta zone est ${fmtPace(lo)}–${fmtPace(hi)}. Courir vite en endurance fatigue sans faire progresser plus vite. La prochaine fois, ralentis, même si ça te paraît trop facile.`]);
    else if (p <= hi + 15) out.push(['bravo', 'Allure maîtrisée', `${fmtPace(p)}/km, dans ta zone. C'est cette discipline qui fait progresser.`]);
    else out.push(['info', 'Plus lent que la zone', `${fmtPace(p)}/km. Aucun souci si tu étais à l'aise. Si c'était dur, note l'effort ressenti : s'il est élevé, j'ajusterai.`]);
  }
  if (p && s && isQ(s) && a.paceKind === 'blocs') {
    const [lo, hi] = range;
    if (p < lo - 8) out.push(['objection', 'Blocs trop rapides', `${fmtPace(p)}/km au lieu de ${fmtPace(lo)}–${fmtPace(hi)}. Trop vite sur les blocs, c'est une séance qui se transforme en course et qui coûte des jours de récupération. Tiens l'allure prévue, pas plus.`]);
    else if (p > hi + 10) out.push(['info', 'Blocs un cran en dessous', `${fmtPace(p)}/km. Si l'effort était déjà très dur, tes allures de référence sont peut-être trop ambitieuses : le prochain test les recalera.`]);
    else out.push(['bravo', 'Séance de qualité réussie', `${fmtPace(p)}/km sur les blocs, exactement ce qu'on cherchait.`]);
  }
  if (s && type === 'test' && (a.durSec || p)) {
    const target = s.dist || 5, n = Math.round(target); let d = 0, t = 0;
    if (a.paceKind === 'blocs' && p) { d = target; t = p * target; }
    else if (a.splits && a.splits.length >= n && a.distKm > target + 1) { let best = Infinity; for (let i = 0; i + n <= a.splits.length; i++) best = Math.min(best, sum(a.splits.slice(i, i + n))); d = n; t = best; }
    else if (a.distKm && a.durSec && a.distKm <= target * 1.25) { d = a.distKm; t = a.durSec; }
    else if (p && !a.durSec) { d = target; t = p * target; }
    if (d >= 3 && t > 0) {
      const t5 = t * Math.pow(5 / d, 1.06), newR = Math.round(t5 / 5), oldR = S.profile.refPace;
      const diff = oldR - newR;
      const txt = Math.abs(diff) < 3 ? "C'est cohérent avec tes allures actuelles." : diff > 0 ? `Tu es plus rapide que prévu de ${fmtGap(diff)} au km.` : `Tu es un peu plus lent·e que prévu, de ${fmtGap(-diff)} au km. Mieux vaut des allures justes que flatteuses.`;
      out.push(['test', `Repère : ${fmtDur(t5)} sur 5 km`, `${txt} Je peux recalculer toutes tes allures d'entraînement à partir de ce résultat.`, { newR }]);
    }
  }
  if (a.rpe >= 8 && easy) out.push(['objection', 'Effort trop élevé pour une sortie facile', `${a.rpe}/10 en endurance, c'est un signal. Sommeil, stress, chaleur ? Si ça se répète cette semaine, je passe la suivante en version allégée.`]);
  if (a.rpe && a.rpe <= 4 && type === 'test') out.push(['info', 'Tu en avais sous le pied', `${a.rpe}/10 sur un test, c'est trop confortable. Au prochain, ose partir un peu plus vite.`]);
  // Weekly volume guardrail
  if (S.plan && a.distKm) {
    const W = S.plan.weeks.find(W => a.date >= W.start && a.date <= W.end);
    if (W) {
      const i = W.n - 1, prev = S.plan.weeks.slice(Math.max(0, i - 3), i).map(x => kmIn(x.start, x.end)).filter(x => x > 0);
      const cur = kmIn(W.start, W.end);
      if (prev.length >= 2) { const avg = sum(prev) / prev.length; if (cur > avg * 1.2 && cur - avg > 3) out.push(['objection', `Volume en hausse de ${Math.round((cur / avg - 1) * 100)} %`, `${fmtKm(cur)} km cette semaine contre ${fmtKm(avg)} km en moyenne. Au-delà de 10 à 15 % de hausse, le risque de blessure grimpe. Plus de kilomètres en plus d'ici la fin de la semaine.`]); }
      if (!s && W.deload) out.push(['objection', 'Sortie en plus en semaine allégée', "Cette semaine sert à assimiler les trois précédentes. Une sortie en plus ici, c'est de la progression en moins la semaine prochaine. Je la note, mais je ne l'approuve pas."]);
    }
  }
  if (s && HARD.includes(type)) {
    const y = addDays(a.date, -1);
    if (S.acts.some(x => x.id !== a.id && x.date === y && HARD.includes(actType(x)))) out.push(['objection', 'Deux séances dures d\'affilée', "Hier était déjà une séance exigeante. Laisse toujours au moins un jour facile ou de repos entre deux séances dures."]);
  }
  if (!s && !out.length) out.push(['info', 'Sortie libre notée', "Elle compte dans ton volume de la semaine. Reste en endurance fondamentale sur ces sorties-là."]);
  if (!out.length) out.push(['bravo', 'Séance enregistrée', "Rien à redire. Continue comme ça."]);
  out.slice().reverse().forEach(o => coachSay(o[0], o[1], o[2], { ...(o[3] || {}), actId: a.id }));
  return out;
}

/* Negotiation: the runner argues, the coach answers with reasons */
function negotiate(sid, reason) {
  const s = findSession(sid), W = weekOf(s);
  const prev = allSessions().filter(x => x.date < s.date).sort((a, b) => a.date < b.date ? 1 : -1)[0];
  const prevMissed = prev && !actFor(prev.id) && (S.skips[prev.id] || prev.date < todayISO());
  const ci = S.checkins[todayISO()]; const low = ci && (ci.sleep + ci.legs + ci.mood) / 3 <= 2.3;
  const r = { reason, sid };
  if (reason === 'fatigue') {
    Object.assign(r, low
      ? { v: 'yes', head: 'Accordé.', text: "Ton bilan du jour le confirme : sommeil, jambes ou moral sont bas. On passe en version allégée. Elle compte comme séance faite.", actions: [['adapt:light', 'Passer en version allégée', true], ['keep', 'Garder la séance prévue']] }
      : { v: 'cond', head: 'Accordé, sous conditions.', text: "La vraie fatigue se respecte, la flemme se contourne. Fais les 10 premières minutes. Si c'est toujours lourd, la version allégée compte comme séance faite.", actions: [['keep', "J'essaie 10 minutes", true], ['adapt:light', 'Passer directement en version allégée']] });
  } else if (reason === 'temps') {
    if (s.type === 'sl') Object.assign(r, { v: 'no', head: 'Refusé.', text: "Une sortie longue raccourcie n'est plus une sortie longue. Déplace-la à un jour où tu as le temps, même demain.", actions: [['move:1', 'Déplacer à demain', true], ['adapt:short', 'Raccourcir quand même (je l\'assume)', false, true]] });
    else Object.assign(r, { v: 'yes', head: 'Accordé.', text: "Version courte : échauffement 10 min, cœur de séance intact, retour au calme 5 min. C'est le cœur qui compte.", actions: [['adapt:short', 'Passer en version courte', true], ['keep', 'Finalement, j\'ai le temps']] });
  } else if (reason === 'plus') {
    if (W.deload) Object.assign(r, { v: 'no', head: 'Refusé.', text: "Semaine allégée : c'est maintenant que ton corps encaisse les trois semaines précédentes. En faire plus, c'est voler la progression de la semaine prochaine.", actions: [['keep', "D'accord, je respecte", true], ['adapt:plus', 'Je le fais quand même (je l\'assume)', false, true]] });
    else if (!EASY.includes(s.type)) Object.assign(r, { v: 'no', head: 'Refusé.', text: "Une séance de qualité se fait au plan près. Les répétitions en plus se paient en fatigue et en blessures, pas en progrès.", actions: [['keep', "D'accord, je respecte", true], ['adapt:plus', 'Je le fais quand même (je l\'assume)', false, true]] });
    else Object.assign(r, { v: 'cond', head: 'Accordé, avec une limite.', text: "+5 minutes maximum, à la même allure lente. Si tu veux progresser plus vite, la patience fait plus que le volume.", actions: [['adapt:plus', 'Ajouter 5 minutes', true], ['keep', 'Rester sur le plan']] });
  } else if (reason === 'sauter') {
    if (prevMissed) Object.assign(r, { v: 'no', head: 'Refusé.', text: "Tu as déjà manqué la séance précédente. Deux de suite, c'est comme ça que les plans s'arrêtent. Fais au moins 20 minutes faciles : ça compte.", actions: [['adapt:mini', 'Version 20 minutes', true], ['skip', 'Sauter quand même (je l\'assume)', false, true]] });
    else if (s.type === 'sl') Object.assign(r, { v: 'cond', head: 'Sous conditions.', text: "Ne sacrifie pas la sortie longue, c'est la plus importante de la semaine. Déplace-la plutôt. S'il faut lâcher quelque chose, lâche une séance d'endurance.", actions: [['move:1', 'Déplacer à demain', true], ['skip', 'Sauter quand même (je l\'assume)', false, true]] });
    else Object.assign(r, { v: 'yes', head: 'Accordé.', text: "Une séance sautée ne casse rien. Surtout, ne la rattrape pas en doublant demain : on continue simplement le plan.", actions: [['skip', 'Sauter cette séance', true], ['keep', 'Finalement, j\'y vais']] });
  } else if (reason === 'douleur') {
    Object.assign(r, { v: 'no', head: 'Stop.', text: "Une douleur qui modifie ta foulée ou qui augmente en courant : pas de course aujourd'hui. Remplace par 30 min de vélo, de natation ou de marche si rien ne fait mal. Si ça dure plus de quelques jours, va voir un professionnel de santé.", actions: [['skip:douleur', 'Remplacer par du repos actif', true]] });
  }
  return r;
}

/* =========================================================
   Rendering helpers
   ========================================================= */
const chip = type => `<span class="chip" style="--c:${TYPES[type].c}">${TYPES[type].name}</span>`;
const rangeTxt = k => { const r = zr(k); return r ? `${fmtPace(r[0])}–${fmtPace(r[1])}` : ''; };
function stepsHTML(s) {
  return `<ol class="steps">${s.steps.map(x => `<li style="--c:${zoneColor(x.zone)}"><span class="sw"></span><span class="sl">${esc(x.label)}${x.zone && x.zone !== 'ef' ? ` · ${ZNAME[x.zone]}` : ''}</span><span class="sp">${zr(x.zone) ? rangeTxt(x.zone) + '/km' : ''}</span><span class="sd">${esc(x.detail)}</span></li>`).join('')}</ol>`;
}
function zoneColor(z) { return ({ ef: 'var(--z-ef)', sl: 'var(--z-sl)', recup: 'var(--z-recup)', fartlek: 'var(--z-tempo)', tempo: 'var(--z-tempo)', allure: 'var(--z-tempo)', frac: 'var(--z-frac)', test: 'var(--z-test)' })[z] || 'var(--line)'; }
function actLine(a) {
  const parts = [];
  if (a.distKm) parts.push(`<span><b>${fmtKm(a.distKm, 2)}</b>km</span>`);
  if (a.durSec) parts.push(`<span><b>${fmtDur(a.durSec)}</b>durée</span>`);
  if (a.paceSec) parts.push(`<span><b>${fmtPace(a.paceSec)}</b>${a.paceKind === 'blocs' ? 'allure blocs' : 'allure /km'}</span>`);
  if (a.rpe) parts.push(`<span><b>${a.rpe}/10</b>effort</span>`);
  return `<div class="statline">${parts.join('')}</div>`;
}
function coachItem(c) {
  const [lbl, mk] = KIND[c.kind] || KIND.info;
  const btn = c.kind === 'test' && c.newR && !c.applied ? `<button class="btn btn-primary" data-act="recal" data-id="${c.id}">Recalculer mes allures</button>` : c.kind === 'test' && c.applied ? `<span class="pill good">${ic('check', 'ic-sm')} Allures mises à jour</span>` : '';
  return `<article class="coach k-${c.kind}"><div class="mk av" aria-hidden="true">${coachSVG(coachCfg(), MOOD[c.kind] || 'neutral', 40)}</div><div><span class="kl">${esc(coachCfg().name)} · ${lbl}</span><h3>${esc(c.title)}</h3><p>${esc(voice(c.kind, c.text))}</p>${btn}</div></article>`;
}
function routeSVG(pts, w = 320, h = 180, pad = 18) {
  const segs = []; let cur = [];
  (pts || []).forEach(p => { if (!p) { if (cur.length) segs.push(cur); cur = []; } else cur.push(p); });
  if (cur.length) segs.push(cur);
  const flat = segs.flat();
  let grid = '';
  for (let x = 20; x < w; x += 24) for (let y = 14; y < h; y += 24) grid += `<circle cx="${x}" cy="${y}" r="1" class="route-grid"/>`;
  if (flat.length < 2) return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Parcours"><rect width="${w}" height="${h}" class="route-bg"/>${grid}<text x="${w / 2}" y="${h / 2}" text-anchor="middle" style="fill:currentColor;opacity:.6;font-size:12px">Le parcours s'affiche ici</text></svg>`;
  const lat0 = flat[0][0] * Math.PI / 180, k = Math.cos(lat0);
  const xs = flat.map(p => p[1] * k), ys = flat.map(p => -p[0]);
  const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
  const sc = Math.min((w - pad * 2) / Math.max(maxX - minX, 1e-9), (h - pad * 2) / Math.max(maxY - minY, 1e-9));
  const ox = (w - (maxX - minX) * sc) / 2, oy = (h - (maxY - minY) * sc) / 2;
  const P = p => [ox + (p[1] * k - minX) * sc, oy + (-p[0] - minY) * sc];
  const d = segs.map(sg => { const step = Math.max(1, Math.floor(sg.length / 400)); return sg.filter((_, i) => i % step === 0 || i === sg.length - 1).map((p, i) => { const [x, y] = P(p); return `${i ? 'L' : 'M'}${x.toFixed(1)} ${y.toFixed(1)}`; }).join(''); }).join('');
  const [sx, sy] = P(flat[0]), [ex, ey] = P(flat[flat.length - 1]);
  return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Tracé du parcours"><rect width="${w}" height="${h}" class="route-bg"/>${grid}<path d="${d}" class="route-line"/><circle cx="${sx}" cy="${sy}" r="6" class="route-start"/><circle cx="${ex}" cy="${ey}" r="6" class="route-end"/></svg>`;
}
function splitsHTML(splits) {
  if (!splits || !splits.length) return '';
  const max = Math.max(...splits), min = Math.min(...splits);
  return `<div class="splits">${splits.map((s, i) => `<div class="split ${s === min && splits.length > 1 ? 'best' : ''}"><span>Km ${i + 1}</span><i style="width:${Math.round(40 + 60 * (max - s) / Math.max(1, max - min))}%"></i><span>${fmtPace(s)}</span></div>`).join('')}</div>`;
}

   ========================================================= */
const logoHTML = (kind = 'wordmark', cls = '') => `<span class="logo ${cls}" role="img" aria-label="Pora">${BRAND[kind]}</span>`;
function splash() {
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const el = document.createElement('div'); el.id = 'splash';
  el.setAttribute('role', 'img'); el.setAttribute('aria-label', 'Pora. Ton coach de course. Un tour après l\'autre.');
  const lap = 'M132.6 178 L174 178 A56 56 0 0 0 174 66 L82 66 A56 56 0 0 0 82 178 L132.6 178';
  const hi = S.profile ? `<p class="sp-hi">Prêt·e, ${esc(S.profile.first)} ?</p>` : '';
  el.innerHTML = `<svg class="sp-track" viewBox="0 0 256 256" aria-hidden="true">
      <path id="sp-ghost" d="${lap}" fill="none" stroke="rgba(207,232,220,.14)" stroke-width="30" stroke-linecap="round"/>
      <path id="sp-draw" d="${lap}" fill="none" stroke="#fff" stroke-width="30" stroke-linecap="round"/>
      <path id="sp-final" d="${BRAND.trackD}" fill="#fff" opacity="0"/>
      <circle id="sp-dot" cx="132.6" cy="178" r="15" fill="#FF6A45"/></svg>
    <div class="sp-word logo" style="color:#fff">${BRAND.wordmark}</div>
    <p class="sp-tag">Ton coach de course. Un tour après l'autre.</p>${hi}
    <span class="sp-hint">Touche l'écran pour sprinter</span>`;
  document.body.appendChild(el);
  const path = el.querySelector('#sp-draw'), dot = el.querySelector('#sp-dot'), fin = el.querySelector('#sp-final');
  const len = path.getTotalLength();
  path.style.strokeDasharray = len; path.style.strokeDashoffset = len;
  let p = 0, speed = 1, last = performance.now(), done = false, gone = false, endT = 0;
  let fast = false; try { fast = localStorage.getItem('pora.splash') === todayISO(); localStorage.setItem('pora.splash', todayISO()); } catch (e) {}
  const LAP = fast ? 650 : 1150;
  const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  const leave = () => { if (gone) return; gone = true; el.classList.add('out'); setTimeout(() => el.remove(), 560); };
  const finish = () => {
    done = true; path.style.strokeDashoffset = 0; path.style.opacity = 0; fin.setAttribute('opacity', 1);
    dot.setAttribute('cx', 132.6); dot.setAttribute('cy', 178);
    if (!reduce) dot.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.35)' }, { transform: 'scale(1)' }], { duration: 420, easing: 'cubic-bezier(.3,1.6,.5,1)', transformOrigin: '132.6px 178px' });
    el.classList.add('reveal'); endT = performance.now();
    setTimeout(leave, reduce ? 700 : fast ? 450 : 1050);
  };
  dot.style.transformBox = 'fill-box'; dot.style.transformOrigin = 'center';
  const frame = now => {
    if (done) return;
    p = Math.min(1, p + (now - last) / LAP * speed); last = now;
    const e = ease(p), pt = path.getPointAtLength(e * len);
    dot.setAttribute('cx', pt.x); dot.setAttribute('cy', pt.y);
    path.style.strokeDashoffset = len * (1 - e);
    if (p >= 1) finish(); else requestAnimationFrame(frame);
  };
  el.addEventListener('pointerdown', ev => {
    const r = document.createElement('span'); r.className = 'ripple'; r.style.left = ev.clientX + 'px'; r.style.top = ev.clientY + 'px'; el.appendChild(r); setTimeout(() => r.remove(), 700);
    if (!done) { speed = 3.2; el.querySelector('.sp-hint').textContent = 'Sprint !'; } else if (performance.now() - endT > 150) leave();
  });
  if (reduce) finish(); else { setTimeout(() => requestAnimationFrame(t => { last = t; frame(t); }), 120); setTimeout(() => { if (!done) finish(); }, 2600); setTimeout(leave, 5000); }
}

  const a = parseInt(hex.slice(1), 16), b = parseInt(to.slice(1), 16);

    ${sortedSessions(W).map(s => { const a = actFor(s.id), stt = status(s);
      const r = stt === 'done' ? `<span class="r done">${a.paceSec ? fmtPace(a.paceSec) : ic('check')}</span>` : stt === 'missed' ? '<span class="r miss">Manquée</span>' : stt === 'skip' ? '<span class="r skip">Sautée</span>' : `<span class="r muted">${ic('chev', 'ic-sm')}</span>`;

function renderProgress() {
  const p = S.profile, acts = S.acts.slice().sort((a, b) => a.date < b.date ? -1 : 1);
  const hist = p.refHistory || [];
  const first = hist[0] ? hist[0].R : p.refPace, delta = (first - p.refPace) * 5;
  const totalKm = sum(acts.map(a => a.distKm || 0));
  const past = allSessions().filter(s => s.date <= todayISO());
  const doneN = past.filter(s => actFor(s.id)).length;
  let h = `<header class="top"><div><p class="eyebrow">Depuis le ${fmtDM(S.plan.start)}</p><h1 class="h1">Progrès</h1></div><button class="btn btn-ghost" style="min-height:40px" data-act="openLog" data-sid="">${ic('plus')} Course</button></header>`;
  h += demoBanner();
  h += `<section class="card stack"><div class="between"><span class="eyebrow">Ton 5 km estimé</span>${Math.abs(delta) >= 3 ? `<span class="pill ${delta > 0 ? 'good' : 'warn'}">${delta > 0 ? '−' : '+'}${fmtDur(Math.abs(delta))} depuis le début</span>` : ''}</div><div class="big5k">${fmtDur(p.refPace * 5)}</div><p class="muted" style="font-size:13.5px">Calculé sur ${hist.length > 1 ? 'ton dernier test' : 'ton estimation de départ'}. Chaque test le met à jour, et toutes tes allures avec.</p>${hist.length > 1 ? refChart(hist) : ''}</section>`;
  h += `<section class="kpis"><div class="kpi"><b>${fmtKm(totalKm, 0)}</b><span>km au total</span></div><div class="kpi"><b>${doneN}/${past.length}</b><span>séances faites</span></div><div class="kpi"><b>${past.length ? Math.round(doneN / past.length * 100) : 0} %</b><span>régularité</span></div></section>`;
  h += `<section class="card stack"><div class="between"><h2 class="h3">Allure par séance</h2><span class="chip" style="--c:var(--z-ef)">Zone endurance</span></div>${paceChart(acts)}</section>`;
  h += `<section class="card stack"><div class="between"><h2 class="h3">Kilomètres par semaine</h2><span class="muted" style="font-size:12.5px">plein : fait · contour : prévu</span></div>${volumeChart()}</section>`;
  h += records(acts);
  h += `<section class="stack"><h2 class="h2">Jalons</h2><div class="badges">${badges().map(b => `<div class="badge ${b.ok ? 'on' : ''}"><span class="medal">${b.m}</span><b>${b.t}</b><small>${b.d}</small></div>`).join('')}</div></section>`;
  h += `<section class="stack"><h2 class="h2">Historique</h2>${acts.length ? `<div class="hist">${acts.slice().reverse().map(a => { const s = a.sessionId && findSession(a.sessionId); const ty = actType(a); return `<button class="hrow" data-act="openAct" data-id="${a.id}"><span class="bar" style="--c:${TYPES[ty].c}"></span><span><b>${esc(s ? s.title : a.stitle || 'Sortie libre')}</b><small>${cap(fmtDate(a.date))}${a.source === 'gps' ? ' · GPS' : a.source === 'sim' ? ' · simulation' : ''}</small></span><span class="r">${a.distKm ? fmtKm(a.distKm, 2) + ' km' : ''}<small>${a.paceSec ? fmtPace(a.paceSec) + '/km' : ''}</small></span></button>`; }).join('')}</div>` : `<div class="empty">Tes courses apparaîtront ici. Lance un GO ou saisis ta première séance.</div>`}</section>`;
  return h;
}
function refChart(hist) {
  const w = 320, h = 70, vals = hist.map(x => x.R * 5), min = Math.min(...vals) - 15, max = Math.max(...vals) + 15;
  const X = i => 14 + i * (w - 28) / Math.max(1, hist.length - 1), Y = v => 10 + (v - min) / (max - min) * (h - 26);
  const d = vals.map((v, i) => `${i ? 'L' : 'M'}${X(i)} ${Y(v)}`).join('');
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Évolution du 5 km estimé"><path d="${d}" fill="none" style="stroke:var(--accent)" stroke-width="2.5" stroke-linecap="round"/>${vals.map((v, i) => `<circle cx="${X(i)}" cy="${Y(v)}" r="${i === vals.length - 1 ? 5 : 3.5}" style="fill:${i === vals.length - 1 ? 'var(--accent)' : 'var(--surface)'};stroke:var(--accent)" stroke-width="2"/><text x="${X(i)}" y="${h - 2}" text-anchor="${i === 0 ? 'start' : i === vals.length - 1 ? 'end' : 'middle'}">${fmtDur(v)}</text>`).join('')}</svg>`;
}
function paceChart(acts) {
  const pts = acts.filter(a => a.paceSec).slice(-24);
  if (pts.length < 2) return `<div class="empty" style="background:var(--surface-2)">Il faut au moins deux séances avec une allure pour tracer la courbe.</div>`;
  const w = 340, h = 190, L = 40, Rr = 10, T = 12, B = 26;
  const ef = zr('ef'); const vals = pts.map(a => a.paceSec).concat(ef);
  let mn = Math.min(...vals) - 15, mx = Math.max(...vals) + 15;
  const Y = v => T + (v - mn) / (mx - mn) * (h - T - B);
  const X = i => L + i * (w - L - Rr) / (pts.length - 1);
  const ticks = [0, 1, 2, 3].map(i => mn + i * (mx - mn) / 3);
  const line = pts.map((a, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)} ${Y(a.paceSec).toFixed(1)}`).join('');
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Allure par séance, plus haut signifie plus rapide">
    ${ticks.map(v => `<line x1="${L}" x2="${w - Rr}" y1="${Y(v)}" y2="${Y(v)}" class="grid"/><text x="${L - 6}" y="${Y(v) + 3.5}" text-anchor="end">${fmtPace(v)}</text>`).join('')}
    <rect x="${L}" y="${Y(ef[0])}" width="${w - L - Rr}" height="${Y(ef[1]) - Y(ef[0])}" style="fill:var(--z-ef)" opacity=".13"/>
    <path d="${line}" fill="none" style="stroke:var(--ink-2)" stroke-width="1.5" opacity=".5"/>
    ${pts.map((a, i) => `<circle cx="${X(i).toFixed(1)}" cy="${Y(a.paceSec).toFixed(1)}" r="${i === pts.length - 1 ? 6 : 4.5}" style="fill:${TYPES[actType(a)].c};stroke:var(--surface)" stroke-width="2"/>`).join('')}
    <text x="${L}" y="${h - 6}">${fmtDM(pts[0].date)}</text><text x="${w - Rr}" y="${h - 6}" text-anchor="end">${fmtDM(pts[pts.length - 1].date)}</text>
  </svg><p class="muted" style="font-size:12.5px">Plus le point est haut, plus tu as couru vite. Les sorties faciles doivent rester dans la bande verte.</p>`;
}
function volumeChart() {
  const P = S.plan, idx = curWeekIdx();
  const data = P.weeks.map(W => ({ n: W.n, plan: sum(W.sessions.map(s => estimate(s).km)), done: kmIn(W.start, W.end), future: W.start > todayISO(), cur: W.n - 1 === idx }));
  const w = 340, h = 170, L = 28, Rr = 6, T = 10, B = 22;
  const max = Math.ceil(Math.max(...data.map(d => Math.max(d.plan, d.done)), 5) / 5) * 5;
  const bw = (w - L - Rr) / data.length;
  const Y = v => T + (1 - v / max) * (h - T - B);
  const ticks = [0, max / 2, max];
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Kilomètres par semaine, prévus et faits">
    ${ticks.map(v => `<line x1="${L}" x2="${w - Rr}" y1="${Y(v)}" y2="${Y(v)}" class="grid"/><text x="${L - 5}" y="${Y(v) + 3.5}" text-anchor="end">${v}</text>`).join('')}
    ${data.map((d, i) => { const x = L + i * bw + bw * 0.18, bwi = bw * 0.64; return `<rect x="${x}" y="${Y(d.plan)}" width="${bwi}" height="${Y(0) - Y(d.plan)}" rx="3" fill="none" style="stroke:var(--line)" stroke-width="1.5" stroke-dasharray="${d.future ? '3 3' : '0'}"/>${d.done ? `<rect x="${x}" y="${Y(d.done)}" width="${bwi}" height="${Y(0) - Y(d.done)}" rx="3" style="fill:${d.cur ? 'var(--go)' : 'var(--accent)'}"/>` : ''}<text x="${x + bwi / 2}" y="${h - 6}" text-anchor="middle" style="${d.cur ? 'font-weight:700;fill:var(--ink)' : ''}">${d.n}</text>`; }).join('')}
  </svg>`;
}
function records(acts) {
  const longest = acts.filter(a => a.distKm).sort((a, b) => b.distKm - a.distKm)[0];
  const splits = acts.flatMap(a => (a.splits || []).map(s => ({ s, a })));
  const bestKm = splits.sort((x, y) => x.s - y.s)[0];
  const tests = acts.filter(a => actType(a) === 'test' && a.durSec && a.distKm >= 4.9 && a.distKm <= 5.3).sort((a, b) => a.durSec - b.durSec)[0];
  const longestT = acts.filter(a => a.durSec).sort((a, b) => b.durSec - a.durSec)[0];
  const row = (lbl, val, sub) => `<div class="zrow"><i style="--c:var(--accent)"></i><span>${lbl}<small>${sub || '—'}</small></span><b>${val || '—'}</b></div>`;
  return `<section class="card"><h2 class="h3" style="margin-bottom:4px">Records</h2><div class="zones">
    ${row('Plus longue sortie', longest && fmtKm(longest.distKm, 1) + ' km', longest && fmtDM(longest.date))}
    ${row('Meilleur kilomètre', bestKm && fmtPace(bestKm.s), bestKm && fmtDM(bestKm.a.date) + ' · GPS')}
    ${row('Meilleur 5 km', tests && fmtDur(tests.durSec), tests && fmtDM(tests.date))}
    ${row('Plus longue durée', longestT && fmtDur(longestT.durSec), longestT && fmtDM(longestT.date))}
  </div></section>`;
}
function badges() {
  const acts = S.acts, km = sum(acts.map(a => a.distKm || 0));
  const efIn = acts.filter(a => { const s = a.sessionId && findSession(a.sessionId); if (!s || !EASY.includes(s.type) || !a.paceSec) return false; const r = zr(zoneKey(s)); return a.paceSec >= r[0] - 5 && a.paceSec <= r[1] + 15; }).length;
  const verdicts = S.plan.weeks.map(W => weekInfo(W).verdict);
  let streak = 0, best = 0; verdicts.forEach(v => { if (v === 'full' || v === 'partial') { streak++; best = Math.max(best, streak); } else if (v) streak = 0; });
  const hist = S.profile.refHistory || []; const pr = hist.some((h, i) => i > 0 && h.source === 'test' && h.R < hist[i - 1].R);
  return [
    { m: '1', t: 'Premier pas', d: 'Première séance enregistrée', ok: acts.length > 0 },
    { m: 'EF', t: 'Patience', d: '5 sorties faciles dans la zone', ok: efIn >= 5 },
    { m: '7/7', t: 'Semaine pleine', d: 'Toutes les séances d\'une semaine', ok: verdicts.includes('full') },
    { m: '×3', t: 'Régularité', d: '3 semaines validées d\'affilée', ok: best >= 3 },
    { m: '10', t: 'Deux chiffres', d: 'Une sortie de 10 km ou plus', ok: acts.some(a => a.distKm >= 10) },
    { m: 'PR', t: 'Plus rapide', d: 'Un test meilleur que le précédent', ok: pr },
    { m: '50', t: '50 km', d: '50 km cumulés', ok: km >= 50 },
    { m: '100', t: '100 km', d: '100 km cumulés', ok: km >= 100 },
    { m: 'OK', t: 'Écoute', d: 'Suivre un conseil du coach en négociation', ok: S.accepted > 0 },
  ];
}

  </div>
  <p class="muted row" style="font-size:13px">${ic('shield', 'ic-sm')} ${syncTxt}</p>

let toastT;
function toast(msg, undo) {
  const t = $('#toast'); t.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button type="button" id="toast-undo">Annuler</button>' : ''}`;
  t.classList.add('show'); t.classList.toggle('act', !!undo); clearTimeout(toastT);
  if (undo) $('#toast-undo').onclick = () => { t.classList.remove('show', 'act'); undo(); };
  toastT = setTimeout(() => t.classList.remove('show', 'act'), undo ? 5000 : 2600);
}
const snap = () => JSON.stringify(S);
function restoreSnap(str) {
  const old = JSON.parse(str), now = new Set(S.acts.map(a => a.id)), was = new Set(old.acts.map(a => a.id));
  S = Object.assign(blank(), old); layout();
  old.acts.forEach(a => { if (!now.has(a.id)) Store.write('a_' + a.id, () => JSON.parse(JSON.stringify(a))); });
  now.forEach(id => { if (!was.has(id)) Store.write('a_' + id, () => null); });
  persist(); render(); toast('Annulé');
}

/* Maps inside sheets: real tiles when Leaflet is present (hosted version), drawn route otherwise */
const MAPQ = {};
function mapBox(track) {
  if (!track || track.filter(Boolean).length < 2) return '';
  const id = 'mb' + uid(); MAPQ[id] = track;
  return `<div class="mapbox" id="${id}">${routeSVG(track)}</div>`;
}
function hydrateMaps() {
  if (!hasMap()) return;
  $$('.mapbox').forEach(el => {
    const tr = MAPQ[el.id]; if (!tr || el.dataset.done) return; el.dataset.done = 1; el.classList.toggle('dark', darkUI());
    try {
      const Lf = window.L; el.innerHTML = '';
      const m = Lf.map(el, { zoomControl: false, attributionControl: true, scrollWheelZoom: false }); m.attributionControl.setPrefix(false);
      Lf.tileLayer(TILE(darkUI()), { attribution: '© OpenStreetMap', maxZoom: 19 }).addTo(m);
      const line = Lf.polyline(segsOf(tr), { color: '#FF6A45', weight: 5, lineCap: 'round' }).addTo(m);
      const flat = tr.filter(Boolean);
      Lf.circleMarker(flat[0], { radius: 7, color: '#fff', weight: 3, fillColor: '#1F6B4E', fillOpacity: 1 }).addTo(m);
      Lf.circleMarker(flat[flat.length - 1], { radius: 7, color: '#fff', weight: 3, fillColor: '#FF6A45', fillOpacity: 1 }).addTo(m);
      m.fitBounds(line.getBounds(), { padding: [18, 18] });
    } catch (e) { el.innerHTML = routeSVG(tr); }
  });
}

(() => {

  ['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => { if (!onMap(e)) e.preventDefault(); }, { passive: false }));
  document.addEventListener('touchmove', e => { if (e.touches && e.touches.length > 1 && !onMap(e)) e.preventDefault(); }, { passive: false });
  document.addEventListener('dblclick', e => { if (!onMap(e)) e.preventDefault(); }, { passive: false });
})();
/* Bottom sheet: drag down to close */
(() => {
  let y0 = null, dy = 0;
  document.addEventListener('touchstart', e => { const p = e.target.closest('.sheet-panel'); if (!p || p.scrollTop > 0 || e.target.closest('input,textarea,select,.bodymap,.mapbox,.tbl-wrap')) return; y0 = e.touches[0].clientY; dy = 0; }, { passive: true });
  document.addEventListener('touchmove', e => { if (y0 == null) return; dy = e.touches[0].clientY - y0; const p = $('.sheet-panel'); if (dy > 0) { p.style.transition = 'none'; p.style.transform = `translateY(${dy}px)`; } }, { passive: true });
  document.addEventListener('touchend', () => { if (y0 == null) return; const p = $('.sheet-panel'); p.style.transition = 'transform .2s ease'; if (dy > 110) { p.style.transform = 'translateY(100%)'; setTimeout(closeSheet, 190); } else p.style.transform = ''; y0 = null; });
})();
window.addEventListener('scroll', () => { const b = document.getElementById('wl-bar'); if (b) b.classList.toggle('on', window.scrollY > 520 && window.scrollY + window.innerHeight < document.documentElement.scrollHeight - 320); }, { passive: true });
document.addEventListener('visibilitychange', () => { if (!RUN.st) return; if (document.visibilityState === 'visible') { if (RUN.st.running) requestWake(); } else saveLive(); });
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'chatForm') { chatSend($('#ch-in').value); return; }
  if (f.id === 'restoreForm') { restoreWith($('#rs-code').value); return; }
  if (f.id === 'logForm') submitLog(f);
  if (f.id === 'runForm') {
    const a = S.acts.find(x => x.id === f.dataset.id); if (!a) return closeSheet();
    a.rpe = +(f.querySelector('input[name=rpe]:checked')?.value || 0) || null; a.note = $('#rf-note').value.trim();
    const b = $('#rf-blocs') && parsePace($('#rf-blocs').value); if (b) { a.paceSec = b; a.paceKind = 'blocs'; }
    const wantPain = f.querySelector('input[name=pain]:checked')?.value === '1';
    S.coach = S.coach.filter(c => c.actId !== a.id); const out = analyze(a); saveAct(a);
    if (wantPain) openPain({ actId: a.id }); else openSheet(coachReply(out, a));
    render();
  }
  if (f.id === 'recalForm') {
    const d = +$('#rc-dist').value, t = parseDur($('#rc-time').value);
    if (!t || t / d < 150 || t / d > 600) { const er = $('#rc-err'); er.textContent = 'Temps au format 31:30 (ou 1:05:00 pour un 10 km).'; er.hidden = false; return; }
    const R = Math.round(t * Math.pow(5 / d, 1.06) / 5);
    applyRecal({ newR: R }); coachSay('bravo', 'Allures recalculées', `5 km estimé : ${fmtDur(R * 5)}. Endurance : ${rangeTxt('ef')}/km.`); persist(); closeSheet(); render(); toast('Allures mises à jour');
  }
  if (f.id === 'editForm') {
    const fi = $('#ed-first').value.trim(), la = $('#ed-last').value.trim(), us = $('#ed-user').value.trim().toLowerCase();
    const er = $('#ed-err');
    if (!fi || !la) { er.textContent = 'Prénom et nom sont nécessaires.'; er.hidden = false; return; }
    if (!/^[a-z0-9._]{3,20}$/.test(us)) { er.textContent = "Nom d'utilisateur : 3 à 20 caractères, lettres, chiffres, point ou tiret bas."; er.hidden = false; return; }
    Object.assign(S.profile, { first: fi, last: la, username: us }); persist(); closeSheet(); render(); toast('Profil mis à jour');
  }
});
function quickPace(sid, val) {
  const s = findSession(sid); let a = actFor(sid); const v = String(val).trim();
  if (!v) { if (a && a.source === 'rapide') { S.coach = S.coach.filter(c => c.actId !== a.id); removeAct(a.id); render(); toast('Allure effacée'); } return; }
  const p = parsePace(v);
  if (!p || p < 150 || p > 900) { toast("Format d'allure : 6:30"); return; }
  const t = todayISO();
  if (!a) { a = { id: uid(), date: s.date <= t ? s.date : t, sessionId: sid, source: 'rapide', createdAt: Date.now() }; S.acts.push(a); }
  a.paceSec = p; a.paceKind = isQ(s) ? 'blocs' : 'avg';
  if (S.skips[sid]) delete S.skips[sid];
  S.coach = S.coach.filter(c => c.actId !== a.id);
  const out = analyze(a); saveAct(a);
  toast(out[0][1]);
  const pv = $('#pv-' + sid), pvv = paceVerdict(s, p); if (pv && pvv) { pv.className = 'pv ' + pvv[0]; pv.textContent = pvv[1]; }
  const el = $('#pi-' + sid); if (el) el.classList.add('has');
}

/* =========================================================
   Boot
   ========================================================= */
(function boot() {
  const local = Store.loadLocal();
  if (local && local.profile) { S = Object.assign(blank(), local); layout(); }
  render();
  splash();
  Store.connect();
  cloudBoot();
  if (window.claude && typeof window.claude.use === 'function') window.claude.use('sample').then(x => { AI = x; }).catch(() => {});
  setTimeout(checkLiveResume, 60);
})();
</script>
